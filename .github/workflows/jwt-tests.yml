name: JWT token regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jwt-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependency
        run: python -m pip install "python-jose[cryptography]>=3.3,<4"
      - name: Validate modified authentication module
        run: python -m py_compile auction_app/api/endpoints/auth.py auction_app/token_security.py
      - name: Run JWT regression tests
        run: python -m unittest discover -s tests -p "test_jwt_tokens.py" -v

name: JWT and authentication regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jwt-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: |
          python -m pip install \
            "fastapi>=0.115,<0.120" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" \
            "python-jose[cryptography]>=3.3,<4" "python-dotenv>=1,<2" \
            "pydantic[email]>=2,<3" "python-multipart>=0.0.9,<1" \
            "fastapi-limiter>=0.1.6,<0.2" "passlib[bcrypt]>=1.7,<2" "bcrypt>=3.2,<4"
      - name: Validate authentication module syntax
        run: python -m py_compile auction_app/api/endpoints/auth.py auction_app/token_security.py auction_app/db/schema.py
      - name: Run JWT and HTTP authentication flow tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

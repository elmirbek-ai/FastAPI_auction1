name: PostgreSQL + Redis authentication integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auction_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction_ci -d auction_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_SERVICE_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql+psycopg2://auction_ci:ci_only_password@localhost:5432/auction_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-only-signing-key-never-use-in-production-123456
      SESSION_SECRET_KEY: test-only-session-key-never-use-in-production-123456

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: |
          python -m pip install \
            "fastapi>=0.115,<0.120" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" \
            "psycopg2-binary>=2.9,<3" "redis>=5,<7" \
            "python-jose[cryptography]>=3.3,<4" "python-dotenv>=1,<2" \
            "pydantic[email]>=2,<3" "python-multipart>=0.0.9,<1" \
            "fastapi-limiter>=0.1.6,<0.2" "passlib[bcrypt]>=1.7,<2" "bcrypt>=3.2,<4" \
            "alembic>=1.13,<2" "sqladmin>=0.20,<1" "fastapi-pagination>=0.12,<1" \
            "uvicorn>=0.30,<1" "itsdangerous>=2,<3"
      - name: Test PostgreSQL + Redis authentication flow
        run: python -m unittest discover -s tests -p "integration_*.py" -v
      - name: Apply and validate Alembic migrations on disposable PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check
      - name: Smoke-test full application startup and SQLAdmin routing
        run: python -m unittest discover -s tests -p "integration_app_startup.py" -v

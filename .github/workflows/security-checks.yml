name: Security configuration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal runtime smoke-test dependencies
        run: python -m pip install "SQLAlchemy>=2,<3" "python-dotenv>=1,<2"
      - name: Run security and isolated database smoke tests
        run: |
          python -m unittest discover -s tests -p "test_security_config.py" -v
          python -m unittest discover -s tests -p "test_database_runtime.py" -v
